name: e0

# Manual only: these runs spend the account's Actions minutes. See configs/README.md for estimated CPU time.
on:
  # workflow_dispatch needs the file on the default branch, which stays untouched, so tags also trigger it:
  # e0-smoke-* for smoke checks, e0-run-* for E0. Tag runs read their models from configs/e0_models.txt.
  # e0b-tune-* and e0b-confirm-* run E0b on base 0.5B, named in configs/e0b.json, and nothing else (A2.3).
  push:
    tags: ["e0-smoke-*", "e0-run-*", "e0b-tune-*", "e0b-confirm-*"]
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated Hugging Face model ids
        required: true
        default: Qwen/Qwen2.5-0.5B
      smoke:
        description: Run the smoke checks instead of E0
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    if: ${{ !startsWith(github.ref_name, 'e0b-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      models: ${{ steps.split.outputs.models }}
    steps:
      - uses: actions/checkout@v4
      - id: split
        env:
          MODELS: ${{ inputs.models }}
        # Standard library only: this turns the input into the JSON list the matrix needs.
        run: |
          if [ -z "$MODELS" ]; then MODELS="$(paste -sd, configs/e0_models.txt)"; fi
          export MODELS
          python3 -c 'import json, os; print("models=" + json.dumps([m.strip() for m in os.environ["MODELS"].split(",") if m.strip()]))' >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: ${{ fromJson(needs.plan.outputs.models) }}
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: ${{ github.workspace }}/.hf-cache
      MODEL: ${{ matrix.model }}
      SMOKE: ${{ inputs.smoke || startsWith(github.ref_name, 'e0-smoke-') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU torch
        run: pip install "torch>=2.3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install the package
        run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-${{ matrix.model }}-v1
      - name: Name the artifact
        # An artifact name may not contain a slash.
        run: echo "TAG=${MODEL//\//__}" >> "$GITHUB_ENV"
      - name: Run
        run: |
          set -o pipefail
          mkdir -p runs/e0
          flag=""
          if [ "$SMOKE" = "true" ]; then flag="--smoke"; fi
          python experiments/run_e0.py --config configs/e0.json --out runs/e0 --device cpu --models "$MODEL" $flag 2>&1 | tee "runs/e0/log-$TAG.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e0-${{ env.TAG }}
          path: runs/e0/
          if-no-files-found: warn

  e0b:
    if: ${{ startsWith(github.ref_name, 'e0b-tune-') || startsWith(github.ref_name, 'e0b-confirm-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: ${{ github.workspace }}/.hf-cache
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU torch
        run: pip install "torch>=2.3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install the package
        run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-Qwen/Qwen2.5-0.5B-v1
      - name: Run
        # Confirm takes its candidate from a committed file, and the tuning output that file must agree with.
        run: |
          set -o pipefail
          mkdir -p runs/e0b
          case "$TAG_NAME" in
            e0b-tune-*)
              python experiments/run_e0b.py --config configs/e0b.json --out runs/e0b --device cpu 2>&1 | tee runs/e0b/log.txt
              ;;
            e0b-confirm-*)
              test -f results/e0b/winner.txt || { echo "results/e0b/winner.txt is not committed"; exit 1; }
              test -f results/e0b/e0b_tune.json || { echo "results/e0b/e0b_tune.json is not committed"; exit 1; }
              if [ -f results/e0b/e0b_confirm.json ]; then echo "A2.3 allows one test, and one is committed"; exit 1; fi
              python experiments/run_e0b.py --config configs/e0b.json --out runs/e0b --device cpu \
                --confirm "$(tr -d '[:space:]' < results/e0b/winner.txt)" \
                --tune-output results/e0b/e0b_tune.json 2>&1 | tee runs/e0b/log.txt
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e0b-${{ github.ref_name }}
          path: runs/e0b/
          if-no-files-found: warn
